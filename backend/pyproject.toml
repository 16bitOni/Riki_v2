[project]
name = "riki"
version = "0.1.0"
description = "Riki: a single-user personal agent with nested sub-agents, full tracing and evals."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-aws>=1.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.2",
    "ddgs>=9.0",
    "riki-mem",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv.sources]
riki-mem = { git = "https://github.com/16bitOni/Riki-mem" }

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
