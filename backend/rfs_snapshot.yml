          - generic [ref=f138e220]: "If you want to build a house or start a business in America, you first need permission from your city. Forms, plan reviews, inspections, and many months of waiting. In some cities, getting the permit takes longer than building the house. City staff are buried in repetitive work: checking drawings against the code, matching applications to zoning rules, sending corrections back and forth. AI models can do all of this. And the delay really matters. Every month of waiting makes projects more expensive, and some just never get built. Every new building pays property tax for decades. We did some math: if all building permits in America were approved in 10% of the current time, US cities would make $16 billion a year in additional tax revenue. We want to fund companies that let AI help run City Hall. Start with permits, but also take on 311, public records, licensing, and inspections. There are 19,000 cities in America, and almost all of them still do all this by hand. The conventional wisdom says you can't sell software to government. That used to be true. It isn't anymore. YC has funded several companies selling AI to government, and some of them are growing faster than almost anything else we've seen. If you're building this, we'd love to hear from you."
