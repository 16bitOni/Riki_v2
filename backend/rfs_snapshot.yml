          - generic [ref=f138e258]: "The most valuable data in the world isn't in the cloud. Defense contractors, banks, hospitals, and nuclear plants keep it behind walls, and they can't send it to an AI API. That's why so much of the economy is still waiting on AI. Founders we work with keep hitting the same wall: the customer loves the product and wants it running entirely inside their own building, with no internet connection. We want to fund the companies that bring frontier AI inside those walls. That means on-prem models, deployment tooling, security accreditation, and hardware. It's slower and harder to sell. It's also where the largest budgets and the most defensible companies are. If you're building this, we'd love to talk."
