          - generic [ref=f138e277]: "Today, nearly every company building with AI rents its intelligence. You send tokens to a frontier lab, get answers back, and pay the bill. That was an easy trade when the best models were years ahead of everything else, and nothing you did with your own data could close the gap. That has changed. Open-weight models are now competitive with the top frontier models on meaningful benchmarks. And as AI moves to the center of how businesses run, companies have become more aware of their dependency on model rental. We think more companies will want to own the models they rely on: improve them on their own data, run them where they choose, and decide for themselves when they change. This matters most in regulated industries, where strict data governance and locked-down infrastructure make renting even more expensive for the performance they get. But there's still a big gap between downloading an open model and owning intelligence that improves a business. Someone has to turn workflows into evals, expertise into training data, production failures into improvements, and carry all of it forward with each new base model. Companies will keep renting frontier intelligence for their hardest problems, but we think many will also own specialized models that encode how their business works and that become more valuable as the business learns. If you're helping companies own their intelligence, we want to hear from you."