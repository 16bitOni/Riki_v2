          - generic [ref=f138e144]: "As LLMs have gotten better at coding and math, they've actually gotten worse at writing. You're not just imagining it: the current models really do sound more robotic than the models from 2024 and 2025. This appears to be not just a temporary glitch, but a structural issue. The same reward signals that make models good at code actively flatten voice and style. If forced to choose, the major labs will always choose to focus on coding and agentic workflows over style. This has left an opportunity open for a startup that cares about producing a model that people like talking to. So if this is something you'd like to work on, we'd love to hear from you."
