          - generic [ref=f138e201]: I think Jev hit a nerve because it gives developers a typed decision and a probability instead of generated text, without training a classifier for every task. I'd like to see more research labs build specialized foundation models for manufacturing, energy, and biology that work zero-shot or from a handful of examples. The bar is matching or beating general-purpose models at orders of magnitude less inference compute, so they're cheap enough to run on everything. For example, Google's TimesFM-3 shows what this looks like for forecasting. It's a 330M-parameter model that forecasts related time series at once with no task-specific fine-tuning and outputs the whole forecast in one forward pass. Training happens once, and each new user brings their own history as context. The hard part is getting high-quality, vertical-specific, verifiable rewards. You'll need rights to the data and a clear win in accuracy and compute over existing specialist models. If you know a field well enough to build its model, we'd like to hear from you.
