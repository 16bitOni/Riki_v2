          - generic [ref=f138e125]: "The best robot foundation models are starting to transfer skills from one robot to another, and I think the bottleneck is moving to the hardware. The U.S. installed 38,400 industrial robots in 2025, up 12 percent, but most robots here are still imported from Japan and Europe. Even the ones assembled here can depend on Chinese magnets. China made 94 percent of the world's sintered rare-earth magnets in 2024, and when it restricted exports in April 2025, some automakers had to cut production. In July, the FCC stopped authorizing new models of connected mobile robots unless they're made here or get an exemption. To count, more than 65 percent of a robot's component cost has to be domestic, rising to 75 percent in 2029. Assembling imported parts won't get you there. We want to fund founders building robots and their supply chain here: rare-earth magnets, motors, strain-wave gears, encoders, force sensors, grippers, chips, battery packs, and the machines that make them. If you're building this, we'd love to talk."
