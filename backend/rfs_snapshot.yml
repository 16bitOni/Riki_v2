          - generic [ref=f138e106]: "Most people talk about AI replacing workers. We're excited about the opposite: AI that turns an ordinary worker into an expert. We're seeing companies hire smart people without credentials, back them with AI, and have them do work that used to need specialists. Imagine a really good customer service rep who's also really good at using AI suddenly able to consult on complicated mergers and acquisitions, supply chain optimization, or global trade. There are millions of jobs like this in benefits, taxes, insurance claims, medical billing, and immigration paperwork. Anywhere a credential is the bottleneck, this model works. The last industrial revolution built a middle class out of factory jobs. This one could build it out of expert jobs. We want to fund the companies that do it."
