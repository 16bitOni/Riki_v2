          - generic [ref=f138e239]: "The AI data center buildout is the largest capital investment project in American history - bigger than the railroads, the highways, and the Manhattan Project - combined. A buildout that large creates opportunities up and down the supply chain. Some of them are famous - everyone knows that there's unprecedented demand for GPUs, electrical power, and skilled electricians. There are also many non-obvious bottlenecks. Large power transformers have a three-year lead time. Switchgear, circuit breakers, and liquid cooling equipment are all sold out. Even raw materials are under pressure: the grain-oriented electrical steel that's used in transformer cores is made in only a single plant in the US, and they're unable to keep up. We're interested in funding companies that are enabling every aspect of the data center supply chain. If that's something you're working on, we'd love to hear from you."
