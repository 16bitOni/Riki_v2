          - generic [ref=f138e182]: Software is cheap to start. Robots, GPU clusters, and data centers aren't. Somebody has to pay for all that steel and silicon up front, and the financing mostly doesn't exist yet. Today, banks underwrite a robot like a forklift. Founders we work with are inventing the instruments themselves, like a lender for robots that each earn $500k/year and put options on GPU capacity. Every great buildout, from railroads to electricity to telecom, created giant financial companies alongside it. We want founders building lenders, leasing companies, securitization, and hedges for the physical AI economy. If you understand both the machines and the money, we'd love to talk.
